<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>roc-docx playground</title>
  <meta name="description" content="See inside a Word document, stage by stage, with roc-docx compiled to WebAssembly.">
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <p id="loading" class="loading">Loading roc-docx…</p>
  <div id="app"></div>
  <noscript>The playground runs roc-docx in your browser and needs JavaScript and WebAssembly.</noscript>
  <script type="module" src="docx-file.mjs"></script>
  <script type="module">
    import { mountRocEngineApp } from "./runtime.mjs";
    await mountRocEngineApp({ wasmUrl: "app.wasm", root: document.getElementById("app"), onWorkerFault: (f) => console.warn("roc-docx playground: worker stopped", f) });
    document.getElementById("loading").remove();
  </script>
</body>
</html>
