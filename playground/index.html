<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>roc-docx playground</title>
  <style>
    :root { --fg: #18181b; --muted: #52525b; --line: #e4e4e7; --bg: #fff; --card: #fafafa; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --bg: #18181b; --card: #27272a; --accent: #60a5fa; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    .playground { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem; display: grid; gap: 0.75rem; }
    .title { margin: 0; font-size: 1.5rem; }
    .hint { color: var(--muted); margin: 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; border-bottom: 1px solid var(--line); }
    .tab { border: 0; background: none; color: var(--muted); padding: 0.5rem 0.75rem; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; }
    .tab.selected { color: var(--fg); border-bottom-color: var(--accent); }
    .status { font-weight: 500; }
    .panel { display: grid; gap: 1rem; }
    .section h2 { font-size: 1rem; margin: 0.5rem 0 0.25rem; }
    .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0.6rem; }
    .card p, .card pre { margin: 0; }
    .card-title { font-weight: 500; overflow-wrap: anywhere; }
    .card-detail { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
    .card-body:empty, .card-detail:empty { display: none; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, monospace; }
    .xml { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; max-height: 70vh; overflow: auto; white-space: pre; }
    .texts { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem; }
    .button { justify-self: start; color: var(--accent); }
    select { font: inherit; justify-self: start; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="docx-file.mjs"></script>
  <script type="module">
    import { mountRocEngineApp } from "./runtime.mjs";
    window.playground = await mountRocEngineApp({ wasmUrl: "app.wasm", root: document.getElementById("app"), onWorkerFault: (f) => console.warn("worker fault", f) });
  </script>
</body>
</html>
