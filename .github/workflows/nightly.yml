name: Nightly compatibility

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: Exact Roc nightly for a diagnostic run; empty resolves latest
        type: string
        default: ''
      release-tag:
        description: Exact final release for a diagnostic run; empty resolves latest
        type: string
        default: ''

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@dd30a5dd576973b6e224db70d96e3e12c96bcc95
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
