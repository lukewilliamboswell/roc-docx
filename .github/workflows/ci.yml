name: CI

on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_dispatch:

permissions: {}

jobs:
  nightly:
    name: Resolve the package compiler
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)"
          [[ "$tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  check:
    name: check
    needs: nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: 'true'
          cache-workload: check
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      # xmllint validates every written part against the ECMA-376 schemas.
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      # The ledger-pinned standards downloads, keyed by the ledger that pins them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .roc-docx/oracle/downloads
          key: oracle-downloads-${{ hashFiles('conformance/ledger.json') }}
      - run: blueprint run check
  libreoffice:
    name: libreoffice
    needs: nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: 'true'
          cache-workload: libreoffice
      # The lane's pass-through cases write the documents LibreOffice reads back.
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      # The distribution's LibreOffice; the lane prints the version it compared against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: blueprint run libreoffice
