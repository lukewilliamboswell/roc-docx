name: CI

on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8f0bb2254540fcdd746bdb4ed10851b4c34c8203
        with:
          cache: 'true'
          cache-workload: check
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
      # xmllint validates every written part against the ECMA-376 schemas.
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      # The ledger-pinned standards downloads, keyed by the ledger that pins them.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .roc-docx/oracle/downloads
          key: oracle-downloads-${{ hashFiles('conformance/ledger.json') }}
      - run: blueprint run check
  libreoffice:
    name: libreoffice
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8f0bb2254540fcdd746bdb4ed10851b4c34c8203
        with:
          cache: 'true'
          cache-workload: libreoffice
      # The lane's pass-through cases write the documents LibreOffice reads back.
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
      # The distribution's LibreOffice; the lane prints the version it compared against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: blueprint run libreoffice
