name: Release

# A pull request builds and tests the release under a version that is never
# published. Dispatch from the default branch with a version to publish it.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, such as 0.1.0 or 0.1.0-rc1; empty runs the dry run
        type: string
        default: ''
      nightly-tag:
        description: Exact Roc nightly for a diagnostic run; empty resolves the latest
        type: string
        default: ''

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@cc6d4081762c6d70bf95bf18c9abf99b5e9ade25
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
      setup-command: '["sudo", "apt-get", "install", "-y", "--no-install-recommends", "libxml2-utils"]'
  # A release changes what the site leads with: once it is published, the
  # site is built by a read-only job and deployed by one holding only the
  # Pages permissions.
  Site:
    needs: Release
    if: inputs.version != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
